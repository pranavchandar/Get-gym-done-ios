name: CI

# This workflow is the project's only way to compile, test and screenshot the app.
# Development happens in a Linux container with no Swift toolchain, no Xcode and no
# simulator, so the loop is: push -> build/test/capture here -> commit the captured
# screenshots and diff report back to the branch -> inspect them from the dev side.

on:
  push:
    branches:
      - "claude/**"
      - main
    paths-ignore:
      - "docs/parity/ios-actual/**"
      - "docs/parity/REPORT.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- domain layer
  # Fast Linux job. Everything accuracy-critical lives here, so this is the gate
  # that matters most and it must stay under a minute.
  kit:
    name: GymDoneKit (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Verify seed catalog is byte-identical to the web app's
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "expected: $(cat docs/parity/seed.sha256)"
          echo "actual:   $(sha256sum GymDoneKit/Sources/GymDoneKit/Resources/seed_data.json | cut -d' ' -f1)"
          test "$(sha256sum GymDoneKit/Sources/GymDoneKit/Resources/seed_data.json | cut -d' ' -f1)" \
             = "$(cat docs/parity/seed.sha256)"

      - name: Build
        working-directory: GymDoneKit
        run: swift build -v

      - name: Test
        working-directory: GymDoneKit
        run: swift test --parallel

  # ---------------------------------------------------------------- iOS app
  app:
    name: iOS app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # First runs are partly reconnaissance: the dev side cannot see this machine,
      # so log what Xcode and which simulators are actually available.
      - name: Toolchain reconnaissance
        run: |
          echo "::group::Xcode"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "::endgroup::"
          echo "::group::All iPhone device types"
          xcrun simctl list devicetypes | grep -i iphone || true
          echo "::endgroup::"
          echo "::group::Runtimes"
          xcrun simctl list runtimes | grep -i ios || true
          echo "::endgroup::"
          echo "::group::Already-instantiated devices"
          xcrun simctl list devices available | grep -i iphone || true
          echo "::endgroup::"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      # Compile check first, against a generic destination. This deliberately does
      # not depend on any simulator existing, so a device-resolution problem can
      # never be mistaken for a code problem.
      - name: Build (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project GetGymDone.xcodeproj \
            -scheme GetGymDone \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          echo "compile check OK"

      - name: Resolve the parity simulator
        id: sim
        run: |
          # Parity wants a 390x844 logical viewport (iPhone 12/13/14). Runner images
          # rotate their preinstalled devices, so: try to CREATE the exact device type
          # if it still ships, then fall back to whatever iPhone is available. Always
          # resolve to a UDID — matching by name is what broke the first run.
          runtime=$(xcrun simctl list runtimes --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).runtimes.filter(x=>x.isAvailable&&/iOS/.test(x.name));r.sort((a,b)=>parseFloat(b.version)-parseFloat(a.version));console.log(r[0]?r[0].identifier:"")})')
          echo "runtime: $runtime"

          udid=""
          for want in "iPhone 14" "iPhone 13" "iPhone 12"; do
            dt=$(xcrun simctl list devicetypes --json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s).devicetypes.find(x=>x.name==='$want');console.log(t?t.identifier:'')})")
            if [ -n "$dt" ] && [ -n "$runtime" ]; then
              if udid=$(xcrun simctl create "parity-$want" "$dt" "$runtime" 2>/dev/null); then
                echo "created $want ($udid)"
                echo "parity=true" >> "$GITHUB_OUTPUT"
                break
              fi
              udid=""
            fi
          done

          if [ -z "$udid" ]; then
            udid=$(xcrun simctl list devices available --json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const g=JSON.parse(s).devices;let best=null;for(const k of Object.keys(g))for(const d of g[k])if(/iPhone/.test(d.name)&&d.isAvailable&&!best)best=d;console.log(best?best.udid:"")})')
            echo "::warning::No 390x844 device type available on this runner image; using an alternative device. The reference corpus must be re-captured at this device's size before pixel parity means anything."
            echo "parity=false" >> "$GITHUB_OUTPUT"
          fi

          test -n "$udid" || { echo "::error::could not resolve any iPhone simulator"; exit 1; }
          xcrun simctl boot "$udid" 2>/dev/null || true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid" || true

      - name: UI tests + screenshot capture
        id: uitests
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project GetGymDone.xcodeproj \
            -scheme GetGymDone \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60

      - name: Export screenshot attachments
        if: always()
        continue-on-error: true
        run: |
          mkdir -p docs/parity/ios-actual
          if [ -d TestResults.xcresult ]; then
            # Xcode 16 syntax; the legacy graph walk is kept as a fallback because
            # this command changed shape between Xcode versions.
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path .attachments 2>/dev/null \
            || xcrun xcresulttool export --type directory \
              --path TestResults.xcresult --output-path .attachments 2>/dev/null \
            || echo "::warning::xcresulttool export failed; see structure dump below"

            if [ -d .attachments ]; then
              echo "::group::exported attachment tree"; find .attachments -type f | head -80; echo "::endgroup::"
              # The UI test names each attachment after its reference shot, so a flat
              # copy of every PNG lands them in the right filenames.
              find .attachments -type f -name "*.png" -exec cp {} docs/parity/ios-actual/ \; 2>/dev/null || true
              # manifest.json carries the human-readable names when files are hashed
              if [ -f .attachments/manifest.json ]; then
                node docs/parity/rename-from-manifest.mjs .attachments docs/parity/ios-actual || true
              fi
            fi
          fi
          echo "captured: $(ls -1 docs/parity/ios-actual 2>/dev/null | wc -l) png(s)"
          ls -1 docs/parity/ios-actual 2>/dev/null | head -40 || true

      - name: Diff against the web reference
        if: always()
        continue-on-error: true
        run: |
          if [ "$(ls -1 docs/parity/ios-actual/*.png 2>/dev/null | wc -l)" -gt 0 ]; then
            node docs/parity/diff.mjs \
              --reference docs/parity/web-reference \
              --actual docs/parity/ios-actual \
              --deviations docs/parity/deviations.yml \
              --out docs/parity/REPORT.md
            cat docs/parity/REPORT.md
          else
            echo "No screenshots captured yet — skipping diff."
          fi

      - name: Commit captures back to the branch
        if: always()
        run: |
          # This is what makes the loop closed: the dev container cannot run a
          # simulator, so the artifacts have to come back through git to be seen.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/parity/ios-actual docs/parity/REPORT.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "CI: simulator captures + parity report [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-and-shots
          path: |
            TestResults.xcresult
            docs/parity/ios-actual
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail if UI tests failed
        if: always() && steps.uitests.outcome == 'failure'
        run: |
          echo "::error::UI tests failed — see the test step log above."
          exit 1
